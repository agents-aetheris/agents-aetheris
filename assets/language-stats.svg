      <text x="120" y="140" class="langPct legend-fade" style="animation-delay: 0.9s;">4.0%</text>
    
      <circle cx="220" cy="135" r="4" fill="#00ADD8" class="legend-fade" style="animation-delay: 1s;" />
      <text x="230" y="140" class="langName legend-fade" style="animation-delay: 1s;">Go</text>

<svg width="820" height="170" viewBox="0 0 820 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metricsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <clipPath id="barClip">
      <rect x="20" y="52" width="780" height="14" rx="7" />
    </clipPath>
  </defs>
  <style>
    @keyframes slide-in-bar {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    @keyframes fade-in-legend {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .title { font: 700 18px 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #ffffff; }
    .langName { font: 600 14px 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #c9d1d9; }
    .langPct { font: 400 14px 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #8b949e; }
    
    .bar-grow { transform-origin: left; animation: slide-in-bar 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    .legend-fade { animation: fade-in-legend 0.8s ease-out both; }
  </style>
  <rect x="1" y="1" width="818" height="168" rx="12" fill="url(#metricsBg)" stroke="#30363d" stroke-width="1.5" />
  
  <text x="22" y="34" class="title">⚡ Real-Time Codebase and Language Distribution</text>
  
  <g clip-path="url(#barClip)">
    <rect x="20" y="52" width="780" height="14" fill="#21262d" />
    <rect x="20" y="52" width="347.3782891825474" height="14" fill="#4F5D95" class="bar-grow" style="animation-delay: 0s;" />
<rect x="367.3782891825474" y="52" width="150.18593307128046" height="14" fill="#3178c6" class="bar-grow" style="animation-delay: 0.1s;" />
<rect x="517.5642222538279" y="52" width="121.63435214568813" height="14" fill="#f1e05a" class="bar-grow" style="animation-delay: 0.2s;" />
<rect x="639.198574399516" y="52" width="47.238735682239394" height="14" fill="#f7523f" class="bar-grow" style="animation-delay: 0.30000000000000004s;" />
<rect x="686.4373100817554" y="52" width="31.390576048097724" height="14" fill="#563d7c" class="bar-grow" style="animation-delay: 0.4s;" />
<rect x="717.8278861298531" y="52" width="28.545467435006735" height="14" fill="#00ADD8" class="bar-grow" style="animation-delay: 0.5s;" />

  </g>
  
  <g>
    
      <circle cx="25" cy="95" r="4" fill="#4F5D95" class="legend-fade" style="animation-delay: 0.5s;" />
      <text x="35" y="100" class="langName legend-fade" style="animation-delay: 0.5s;">PHP</text>
      <text x="120" y="100" class="langPct legend-fade" style="animation-delay: 0.5s;">44.5%</text>
    
      <circle cx="220" cy="95" r="4" fill="#3178c6" class="legend-fade" style="animation-delay: 0.6s;" />
      <text x="230" y="100" class="langName legend-fade" style="animation-delay: 0.6s;">TypeScript</text>
      <text x="315" y="100" class="langPct legend-fade" style="animation-delay: 0.6s;">19.3%</text>
    
      <circle cx="415" cy="95" r="4" fill="#f1e05a" class="legend-fade" style="animation-delay: 0.7s;" />

      <text x="510" y="100" class="langPct legend-fade" style="animation-delay: 0.7s;">15.6%</text>
    
      <circle cx="610" cy="95" r="4" fill="#f7523f" class="legend-fade" style="animation-delay: 0.8s;" />
      <text x="620" y="100" class="langName legend-fade" style="animation-delay: 0.8s;">Blade</text>
      <text x="705" y="100" class="langPct legend-fade" style="animation-delay: 0.8s;">6.1%</text>
    

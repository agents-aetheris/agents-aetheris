<rect x="679.2544161991059" y="52" width="50.29460079810375" height="14" fill="#f7523f" class="bar-grow" style="animation-delay: 0.30000000000000004s;" />
<rect x="729.5490169972096" y="52" width="33.421226634462485" height="14" fill="#563d7c" class="bar-grow" style="animation-delay: 0.4s;" />
<rect x="762.9702436316721" y="52" width="16.93122355906268" height="14" fill="#e34c26" class="bar-grow" style="animation-delay: 0.5s;" />

  </g>
  
  <g>
    
      <circle cx="25" cy="95" r="4" fill="#4F5D95" class="legend-fade" style="animation-delay: 0.5s;" />
      <text x="35" y="100" class="langName legend-fade" style="animation-delay: 0.5s;">PHP</text>
      <text x="120" y="100" class="langPct legend-fade" style="animation-delay: 0.5s;">47.4%</text>
    

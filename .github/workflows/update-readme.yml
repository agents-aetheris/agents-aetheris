name: Update README with Latest Activity

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Enables manual run from the GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - '.github/scripts/update_readme.mjs'
      - '.github/workflows/update-readme.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run README Update Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update_readme.mjs

      - name: Generate streak stats
        uses: be-next/github-streak-stats-action@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.MIRROR_SYNC_TOKEN }}
          output-path: streak-stats.svg
          theme: dark
          hide_border: true
          background: "0D1117"
          stroke: "00FF41"
          ring: "7B2FBE"
          fire: "FF6B35"
          currStreakLabel: "00FF41"
          sideLabels: "ffffff"
          dates: "888888"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/ streak-stats.svg
          if git diff --staged --quiet; then
            echo "No changes detected. Working tree is clean."
          else
            git commit -m "docs(profile): automate latest activity and streak stats [skip ci]" -m "Co-authored-by: aetheris <agents.aetheris@gmail.com>"
            git push origin main
          fi
